# Site rieng cho may chu tinh gia. MOT TEP RIENG, khong sua site nao dang chay.
#
# Neu may chu nay dung chung droplet voi PacOs: PacOs dang phuc vu nha may that,
# va mot dau ngoac go nham trong tep cua no la ca he thong 502. Tep nay dung
# rieng, va `nginx -t` bao truoc khi reload - PacOs khong he bi dung toi.
#
# Cai dat:
#   sudo cp nginx-pricing.conf /etc/nginx/sites-available/pricing
#   sudo ln -sfn /etc/nginx/sites-available/pricing /etc/nginx/sites-enabled/pricing
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d download.pantongone.com
#
# Truoc khi chay certbot: ban ghi A `pricing` phai co o Cloudflare va de
# DNS only (dam may XAM). Bat proxy len thi certbot khong xac minh duoc.

server {
    listen 80;
    listen [::]:80;
    server_name download.pantongone.com;

    # Ban .exe ~13 MB di qua duong nay. Mac dinh cua nginx la 1 MB va no tu tra
    # ve trang loi HTML cua chinh no - trinh duyet tai duoc mot tep hong ma
    # khong bao gi.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mot may tram cham co the mat vai phut de day len het mot ngay lam
        # viec. 30 giay mac dinh se cat giua chung, va ban dong bo do se phai
        # bat dau lai.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Tep cai dat: khong dem, va cho phep tai tiep khi dut.
    location /download/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
